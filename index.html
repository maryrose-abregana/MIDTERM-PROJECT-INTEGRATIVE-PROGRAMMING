<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DaMary's Team</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">DaMary's</div>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Favorites</a></li>
        <li><a href="#">Contacts</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>Meet Our <span class="highlight">Team</span></h1>
    <p>Swipe right to explore our profiles.</p>
  </section>

  <section class="profiles">
    <div class="profile-container">
      <div class="profile-card">
        <img src="images/rose.jpg" alt="Member 1">
        <h2>Mary Rose Abregana</h2>
        <p>Web Developer | Designer</p>
        <button class="btn">Get in Touch →</button>
      </div>

      <div class="profile-card">
        <img src="images/member2.jpg" alt="Member 2">
        <h2>Mary Grace Sombilon</h2>
        <p>Backend Engineer | Innovator</p>
        <button class="btn">Get in Touch →</button>
      </div>
      
      <div class="profile-card">
        <img src="images/member3.jpg" alt="Member 3">
        <h2>Daiseree Carzano</h2>
        <p>UI/UX Specialist | Creator</p>
        <button class="btn">Get in Touch →</button>
      </div>
    </div>
    <p class="swipe">SWIPE RIGHT ➡➡</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
